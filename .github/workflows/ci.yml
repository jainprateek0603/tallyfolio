name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Explicit in case the package manager skips the postinstall script.
      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:unit

      - name: Seed a scratch database
        run: |
          npx prisma db push --skip-generate
          npm run db:seed
